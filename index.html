<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="/favicon_io/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon_io/site.webmanifest" />

  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=ranade@400,500,600,700&display=swap" rel="stylesheet" />

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#fdfdfd" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("simplechat:theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#121210" : "#fdfdfd");
      } catch (e) { }
    })();
  </script>

  <title>SimpleChat</title>
  <meta name="description" content="A small, focused AI chat app. Conversations stay on your device." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="SimpleChat" />
  <meta property="og:description" content="A small, focused AI chat app." />
  <meta property="og:image" content="/img/SimpleChat.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
